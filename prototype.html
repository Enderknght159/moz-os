<style>
  :root{--bg:#f6f6f3;--surface:#eaeae5;--ink:#111;--muted:#6d6d69;--line:#dcdcd6;--purple:#7546f0;
    --grad:linear-gradient(90deg,#8e50f9,#b44cbb 16%,#d8486f 33%,#ee4b3e 48%,#f0902f 62%,#e9c93c 76%,#a9cd52 88%,#41b56e);
    --ar:"Alexandria","Segoe UI",sans-serif;--en:"Poppins","Segoe UI",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--ar);
    display:grid;place-items:center;padding:24px}
  body::before{content:"";position:fixed;inset-block-start:0;inset-inline:0;height:3px;background:var(--grad)}
  .card{width:min(400px,100%);background:#fff;border-radius:22px;padding:34px 30px;
    box-shadow:0 40px 80px -60px rgba(17,17,17,.55);text-align:center}
  .logo{height:22px;margin-bottom:26px}
  h1{font-size:1.15rem;font-weight:700;margin:0 0 6px}
  p{font-size:.8rem;color:var(--muted);line-height:1.8;margin:0 0 18px}
  input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-family:var(--en);
    font-size:.9rem;outline:none;text-align:center;letter-spacing:.05em;transition:.2s}
  input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(117,70,240,.1)}
  button{width:100%;margin-top:10px;background:var(--ink);color:var(--bg);border:0;border-radius:12px;
    padding:11px;font-family:var(--ar);font-size:.84rem;font-weight:600;cursor:pointer;transition:.25s}
  button:hover{background:var(--purple)}
  .err{font-size:.74rem;color:#b62c24;margin-top:10px;min-height:18px}
  .note{font-family:var(--en);font-size:.62rem;letter-spacing:.14em;color:#9a9a95;margin-top:22px;text-transform:uppercase}
</style>
</head>

const ITER = 210000;
const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(){
  const pw = document.getElementById('pw').value.trim();
  const err = document.getElementById('err');
  if(!pw){ err.textContent = 'أدخل كلمة المرور'; return; }
  err.textContent = '';
  try{
    const blob = dec(B64);
    const salt = blob.slice(0,16), iv = blob.slice(16,28), data = blob.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations: ITER, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent = 'كلمة المرور غير صحيحة';
    document.getElementById('pw').select();
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
